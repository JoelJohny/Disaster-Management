<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRMS Prototype</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f0f2f5; --border:#e2e5ea;
  --text:#14181f; --text-dim:#5b6472; --text-faint:#8c96a5;
  --brand:#1b5e8a; --brand-ink:#ffffff; --brand-soft:#e6f0f7;
  --crit:#b3261e; --crit-soft:#fdeceb; --high:#b45309; --high-soft:#fdf3e3;
  --med:#1b5e8a; --med-soft:#e6f0f7; --low:#3f6212; --low-soft:#eef5e4;
  --ok:#2e6b35; --ok-soft:#e9f3ea;
  --radius:10px; --radius-sm:7px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-lg:0 8px 28px rgba(16,24,40,.14);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --surface:#161b22; --surface-2:#1d232c; --border:#2b323c;
    --text:#e8ecf1; --text-dim:#9aa5b4; --text-faint:#6e7987;
    --brand:#4a9fd5; --brand-ink:#08131c; --brand-soft:#15303f;
    --crit:#f2837c; --crit-soft:#3a1a18; --high:#e0a355; --high-soft:#382a14;
    --med:#4a9fd5; --med-soft:#15303f; --low:#9ac45c; --low-soft:#23300f;
    --ok:#7bc084; --ok-soft:#162a19;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 8px 28px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#161b22; --surface-2:#1d232c; --border:#2b323c;
  --text:#e8ecf1; --text-dim:#9aa5b4; --text-faint:#6e7987;
  --brand:#4a9fd5; --brand-ink:#08131c; --brand-soft:#15303f;
  --crit:#f2837c; --crit-soft:#3a1a18; --high:#e0a355; --high-soft:#382a14;
  --med:#4a9fd5; --med-soft:#15303f; --low:#9ac45c; --low-soft:#23300f;
  --ok:#7bc084; --ok-soft:#162a19;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 8px 28px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--brand)}

/* ---------- demo chrome ---------- */
.democtl{
  position:sticky;top:0;z-index:60;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:9px 16px;background:var(--text);color:var(--bg);font-size:12.5px;
}
.democtl b{font-weight:650;letter-spacing:.02em}
.democtl .sp{flex:1}
.roleswitch{display:flex;background:rgba(127,127,127,.25);border-radius:7px;padding:2px}
.roleswitch button{
  padding:4px 11px;border-radius:5px;color:inherit;opacity:.65;font-size:12.5px;font-weight:550;
}
.roleswitch button[aria-pressed="true"]{background:var(--bg);color:var(--text);opacity:1}
.democtl .lnk{color:inherit;opacity:.7;text-decoration:underline;font-size:12.5px}
.democtl .lnk:hover{opacity:1}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:238px 1fr;min-height:calc(100vh - 38px)}
.sidebar{
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:38px;height:calc(100vh - 38px);
}
.brand{
  display:flex;align-items:center;gap:9px;padding:15px 16px;border-bottom:1px solid var(--border);
}
.brand .mark{
  width:28px;height:28px;border-radius:7px;background:var(--brand);color:var(--brand-ink);
  display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;
}
.brand .nm{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.brand .sub{font-size:11px;color:var(--text-faint);margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:10px 8px}
.navsec{
  font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-faint);padding:12px 9px 5px;
}
.nav a{
  display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:var(--radius-sm);
  color:var(--text-dim);text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:1px;
}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav a .ic{width:17px;text-align:center;font-size:14px;flex:none}
.nav a .pill{
  margin-left:auto;background:var(--crit);color:#fff;font-size:10.5px;font-weight:700;
  padding:1px 6px;border-radius:9px;
}
.whoami{
  border-top:1px solid var(--border);padding:11px 14px;display:flex;align-items:center;gap:9px;
}
.av{
  width:31px;height:31px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-weight:650;font-size:12px;flex:none;
}
.whoami .n{font-size:13px;font-weight:600;line-height:1.25}
.whoami .r{font-size:11px;color:var(--text-faint)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;gap:14px;padding:11px 22px;
  background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:38px;z-index:20;
}
.evt{
  display:flex;align-items:center;gap:8px;font-size:12.5px;
  background:var(--crit-soft);color:var(--crit);padding:5px 11px;border-radius:99px;font-weight:600;
}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.topbar .sp{flex:1}
.iconbtn{
  position:relative;width:34px;height:34px;border-radius:var(--radius-sm);
  display:grid;place-items:center;color:var(--text-dim);font-size:16px;
}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn .badge{
  position:absolute;top:4px;right:4px;min-width:15px;height:15px;padding:0 3px;
  background:var(--crit);color:#fff;border-radius:9px;font-size:9.5px;font-weight:700;
  display:grid;place-items:center;border:2px solid var(--surface);
}
.content{padding:22px;max-width:1180px;width:100%}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .content{padding:16px}
}

/* ---------- primitives ---------- */
.h1{font-size:21px;font-weight:650;letter-spacing:-.02em}
.sub{color:var(--text-dim);font-size:13.5px;margin-top:3px}
.pagehead{margin-bottom:18px;display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.pagehead .sp{flex:1}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.card-p{padding:16px}
.cardhead{
  padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;
}
.cardhead h3{font-size:14px;font-weight:650}
.cardhead .sp{flex:1}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:960px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
@media(max-width:560px){.g4{grid-template-columns:1fr}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 14px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;
  background:var(--surface-2);color:var(--text);border:1px solid var(--border);
}
.btn:hover{border-color:var(--text-faint)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;border-color:transparent;color:var(--text-dim)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}

.tag{
  display:inline-flex;align-items:center;gap:5px;padding:2.5px 9px;border-radius:99px;
  font-size:11.5px;font-weight:650;letter-spacing:.01em;white-space:nowrap;
}
.t-CRITICAL{background:var(--crit-soft);color:var(--crit)}
.t-HIGH{background:var(--high-soft);color:var(--high)}
.t-MEDIUM{background:var(--med-soft);color:var(--med)}
.t-LOW{background:var(--low-soft);color:var(--low)}
.t-SUBMITTED{background:var(--med-soft);color:var(--med)}
.t-ASSIGNED{background:var(--high-soft);color:var(--high)}
.t-IN_PROGRESS{background:var(--high-soft);color:var(--high)}
.t-COMPLETED{background:var(--ok-soft);color:var(--ok)}
.t-CANCELLED{background:var(--surface-2);color:var(--text-faint)}
.t-PENDING{background:var(--high-soft);color:var(--high)}
.t-APPROVED{background:var(--ok-soft);color:var(--ok)}
.t-ACTIVE{background:var(--crit-soft);color:var(--crit)}
.t-UPCOMING{background:var(--high-soft);color:var(--high)}
.t-PAST{background:var(--surface-2);color:var(--text-faint)}
.t-OPEN{background:var(--ok-soft);color:var(--ok)}
.t-FULL{background:var(--high-soft);color:var(--high)}

.kpi{padding:15px 16px}
.kpi .lbl{font-size:12px;color:var(--text-dim);font-weight:550}
.kpi .val{font-size:27px;font-weight:680;letter-spacing:-.025em;margin:5px 0 2px;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:11.5px;color:var(--text-faint)}
.kpi .delta.up{color:var(--ok)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text-faint);padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap;
}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.ref{font-family:var(--mono);font-size:12px;color:var(--text-dim)}
.tbl-wrap{overflow-x:auto}

.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--text-faint);font-weight:400;margin-left:5px}
.ctl{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--bg);font-size:14px;
}
.ctl:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
.ctl.bad{border-color:var(--crit);background:var(--crit-soft)}
.err{color:var(--crit);font-size:12px;margin-top:4px;display:flex;gap:5px;align-items:center}

.steps{display:flex;align-items:center;margin-bottom:22px}
.step{display:flex;align-items:center;gap:8px}
.step .n{
  width:29px;height:29px;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:650;background:var(--surface-2);color:var(--text-faint);
  border:1.5px solid var(--border);flex:none;
}
.step.done .n{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.step .t{font-size:12px;font-weight:600;color:var(--text-faint);letter-spacing:.03em}
.step.done .t{color:var(--text)}
.stepbar{flex:1;height:1.5px;background:var(--border);margin:0 11px}
.stepbar.done{background:var(--brand)}

.timeline{position:relative;padding-left:26px}
.timeline::before{
  content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1.5px;background:var(--border);
}
.tl{position:relative;padding-bottom:17px}
.tl:last-child{padding-bottom:0}
.tl::before{
  content:"";position:absolute;left:-22px;top:4px;width:9px;height:9px;border-radius:50%;
  background:var(--brand);border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--brand);
}
.tl.now::before{background:var(--crit);box-shadow:0 0 0 1.5px var(--crit)}
.tl .w{font-size:13.5px;font-weight:600}
.tl .m{font-size:12.5px;color:var(--text-dim);margin-top:1px}
.tl .t{font-size:11.5px;color:var(--text-faint);margin-top:2px;font-variant-numeric:tabular-nums}

.empty{padding:44px 20px;text-align:center;color:var(--text-faint)}
.empty .ic{font-size:30px;opacity:.5}
.empty .t{font-weight:600;color:var(--text-dim);margin-top:9px;font-size:14px}
.empty .d{font-size:13px;margin-top:3px}

.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.pill-f{
  padding:5.5px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface);
  font-size:12.5px;font-weight:600;color:var(--text-dim);display:flex;gap:6px;align-items:center;
}
.pill-f .c{
  background:var(--surface-2);padding:0 6px;border-radius:9px;font-size:11px;
  font-variant-numeric:tabular-nums;
}
.pill-f[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pill-f[aria-pressed="true"] .c{background:rgba(255,255,255,.2)}

.stars{display:flex;gap:4px}
.stars button{font-size:26px;color:var(--border);line-height:1;padding:2px}
.stars button.lit{color:#e0a355}
.stars button:focus-visible{outline:2px solid var(--brand);border-radius:4px}

.sos{
  width:100%;padding:17px;border-radius:var(--radius);background:var(--crit);color:#fff;
  font-size:16px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;
  justify-content:center;gap:10px;box-shadow:var(--shadow);
}
.sos:hover{filter:brightness(1.07)}
.sos .s{font-size:11.5px;font-weight:500;opacity:.85;letter-spacing:0}

.toasts{position:fixed;bottom:18px;right:18px;z-index:80;display:flex;flex-direction:column;gap:9px}
.toast{
  background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--brand);
  border-radius:var(--radius-sm);padding:11px 15px;box-shadow:var(--shadow-lg);
  min-width:270px;max-width:370px;animation:slide .22s ease-out;
}
.toast.bad{border-left-color:var(--crit)}
.toast.good{border-left-color:var(--ok)}
.toast .t{font-size:13.5px;font-weight:650}
.toast .m{font-size:12.5px;color:var(--text-dim);margin-top:2px}
@keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

.modal-bg{
  position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:70;
  display:grid;place-items:center;padding:20px;
}
.modal{
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
}
.modal .hd{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
.modal .hd h3{font-size:15px;font-weight:650;flex:1}
.modal .bd{padding:18px}
.modal .ft{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end}

.note{
  background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);
  border-radius:var(--radius-sm);padding:11px 14px;font-size:12.5px;color:var(--text-dim);
  display:flex;gap:9px;
}
.note .ic{color:var(--brand);flex:none}
.note b{color:var(--text)}

.bars{display:flex;align-items:flex-end;gap:7px;height:96px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bars .b i{
  width:100%;background:var(--brand);border-radius:3px 3px 0 0;display:block;min-height:3px;
  opacity:.78;
}
.bars .b:last-child i{opacity:1}
.bars .b span{font-size:10.5px;color:var(--text-faint)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px}
.kv dt{color:var(--text-dim);white-space:nowrap}
.kv dd{font-weight:550}
.locked{
  background:var(--surface-2);border:1px dashed var(--border);border-radius:var(--radius-sm);
  padding:11px 14px;font-size:12.5px;color:var(--text-faint);display:flex;gap:8px;align-items:center;
}
.forbidden{
  max-width:440px;margin:56px auto;text-align:center;
}
.forbidden .code{font-size:52px;font-weight:700;color:var(--crit);letter-spacing:-.03em}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px}
.sronly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<div class="democtl">
  <b>DRMS PROTOTYPE</b>
  <span style="opacity:.6">Click through as:</span>
  <div class="roleswitch" id="roles"></div>
  <span class="sp"></span>
  <button class="lnk" onclick="demoRace()">▶ Demo the claim race</button>
  <button class="lnk" onclick="demoForbidden()">▶ Demo RBAC block</button>
  <button class="lnk" onclick="toggleTheme()">◐ Theme</button>
  <button class="lnk" onclick="resetAll()">↺ Reset</button>
</div>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">DR</div>
      <div>
        <div class="nm">DRMS</div>
        <div class="sub">Kerala Relief Network</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="whoami">
      <div class="av" id="avatar">P</div>
      <div style="min-width:0">
        <div class="n" id="uname">Priya Menon</div>
        <div class="r" id="urole">Victim · Ernakulam</div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="evt"><span class="dot"></span> Kerala Floods 2025 · SEVERE · ACTIVE</div>
      <span class="sp"></span>
      <button class="iconbtn" onclick="openBell()" title="Notifications">
        🔔<span class="badge" id="bellct">0</span>
      </button>
      <button class="iconbtn" title="Help">?</button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div id="modal"></div>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const typeLabel = c => (S.types.find(t=>t.code===c)||{}).label || c;

const unread = () => S.notes.filter(n => !n.read).length;

function toast(title, msg, kind){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind||'');
  el.innerHTML = `<div class="t">${esc(title)}</div><div class="m">${esc(msg)}</div>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 4200);
}
function notify(t, m){
  S.notes.unshift({t, m, w:'just now', read:false});
  document.getElementById('bellct').textContent = unread();
}
function closeModal(){ document.getElementById('modal').innerHTML = ''; }

function setD(k,v){ draft[k]=v; }
function stepBack(){ if(draft.step>1){draft.step--; render();} }
function stepNext(){
  const need = draft.step===1 ? ['type','urgency'] : ['place','people'];
  need.forEach(k=>draft.touched[k]=true);
  if(need.some(k=>!draft[k])){ render(); toast('Check the form','Some required fields are empty.','bad'); return; }
  draft.step++; render();
}
function submitReq(){
  draft.touched.desc = true;
  if(!draft.desc){ render(); toast('Check the form','Please describe your situation.','bad'); return; }
  const n = 47;
  const ref = 'REQ-2026-0000' + n;
  S.requests.unshift({
    ref, type:draft.type, urgency:draft.urgency, status:'SUBMITTED', by:'Priya Menon', byId:1,
    place:draft.place, people:+draft.people, dist:2.2,
    tl:[['SUBMITTED','Priya Menon','20 Sep, now']]
  });
  draft = null;
  toast('Request submitted', ref + ' is now visible to nearby volunteers.', 'good');
  go('v-req:'+ref);
}

      </div>
      <div class="note" style="margin-top:15px"><span class="ic">✱</span>
      <div>Press <b>both</b>, one after the other. Exactly one wins — enforced by a
      <code>UNIQUE</code> index on a generated column, not by an if-statement.</div></div>
    </div>`);
}
function raceGo(ref, who){
  const r = S.requests.find(x=>x.ref===ref);
  if(r.status !== 'SUBMITTED'){
    toast('409 ALREADY_CLAIMED', 'Already accepted by ' + r.assignee.split(' ')[0] + '.', 'bad');
    closeModal();
    setTimeout(()=>showRaceProof(r, who), 500);
    return;
  }
  r.status='ASSIGNED'; r.assignee=who; r.tl.push(['ASSIGNED',who,'20 Sep, now']);
  raceDone = true;
  notify('Volunteer assigned', who + ' has accepted ' + ref + '.');
  toast('201 ACCEPTED', who + ' won the race.', 'good');
  render();
  demoRace.again = ref;
  modal(`
    <div class="hd"><h3>${esc(who)} won</h3><button class="btn sm ghost" onclick="closeModal()">✕</button></div>
    <div class="bd">
      <div class="sub" style="margin-bottom:13px">Now press the other one and watch it lose.</div>
      <button class="btn" style="width:100%" onclick="raceGo('${ref}','${who==='Arun Kumar'?'Meera Thomas':'Arun Kumar'}')">
        ${who==='Arun Kumar'?'Meera':'Arun'} presses Accept</button>
    </div>`);
}
function showRaceProof(r, loser){
  modal(`
    <div class="hd"><h3>What the database did</h3><button class="btn sm ghost" onclick="closeModal()">✕</button></div>
    <div class="bd">
      <div class="sub" style="margin-bottom:13px">${esc(loser)} got a clean 409. Here is why it is
      impossible to get two:</div>
      <pre style="background:var(--surface-2);padding:13px;border-radius:7px;font-family:var(--mono);
                  font-size:11.5px;overflow-x:auto;line-height:1.55">active_help_request_id BIGINT UNSIGNED
  GENERATED ALWAYS AS (
    CASE WHEN status IN ('ASSIGNED','IN_PROGRESS',
                         'AWAITING_CONFIRMATION')
         THEN help_request_id ELSE NULL END
  ) STORED,
UNIQUE KEY uq_one_active_assignment (active_help_request_id)</pre>
      <div class="note" style="margin-top:14px"><span class="ic">ℹ</span>
      <div>MySQL has <b>no partial indexes</b>. So the column is <code>NULL</code> unless the assignment
      is live, and MySQL treats <code>NULL</code>s in a UNIQUE index as <b>distinct</b> — unlimited closed
      assignments can coexist with at most one open one. The rule lives in the database, so no code path
      can bypass it.</div></div>
      <div style="margin-top:13px;font-family:var(--mono);font-size:11.5px;background:var(--surface-2);
                  padding:11px;border-radius:7px">
        $ node scripts/race-test.mjs<br>
        <span style="color:var(--ok)">1 × 201 ACCEPTED</span><br>
        <span style="color:var(--crit)">9 × 409 ALREADY_CLAIMED</span>
      </div>
    </div>`);
}

      </a>`).join('')
  ).join('');

  document.getElementById('avatar').textContent = u.initials;
  document.getElementById('uname').textContent = u.name;
  document.getElementById('urole').textContent =
    u.role[0]+u.role.slice(1).toLowerCase() + (u.district!=='—' ? ' · '+u.district : '');
  document.getElementById('bellct').textContent = unread();

  // view
  let html;
  if(route.startsWith('v-req:')) html = vReq(route.slice(6));
  else html = ({
    'v-dash':vDash, 'v-new':vNew, 'v-mine':vMine,
    'vol-dash':volDash, 'vol-pool':volPool, 'vol-mine':volMine,
    'a-dash':aDash, 'a-users':aUsers, 'a-reqs':aReqs, 'a-events':aEvents, 'a-reports':aReports,
    'profile':profile, 'forbidden':forbidden,
  }[route] || vDash)();
  document.getElementById('view').innerHTML = html;
}
render();
</script>
</body>
</html>
