<header class="sticky top-0 z-20 flex items-center gap-3 border-b border-gray-200 bg-white px-4 py-2.5 sm:px-6">

  @if (isMobile) {
    <button type="button" (click)="menuToggle.emit()" aria-label="Open menu"
            class="grid h-9 w-9 place-items-center rounded-lg text-gray-500 hover:bg-gray-100">☰</button>
  }

  @if (ref.activeDisaster(); as d) {
    <div class="flex items-center gap-2 rounded-full bg-red-50 px-3 py-1.5 text-xs font-semibold text-red-800">
      <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-current"></span>
      <span class="hidden sm:inline">{{ d.title }} · {{ d.severity }} ·</span>
      <span>{{ d.state }}</span>
    </div>
  }

  <div class="flex-1"></div>

  <!-- notifications -->
  <div class="relative">
    <button type="button" (click)="toggleBell()"
            [attr.aria-label]="'Notifications, ' + notifications.unread() + ' unread'"
            class="relative grid h-9 w-9 place-items-center rounded-lg text-gray-500 hover:bg-gray-100">
      🔔
      @if (notifications.unread() > 0) {
        <span class="absolute right-1 top-1 grid h-4 min-w-4 place-items-center rounded-full
                     bg-red-600 px-1 text-[10px] font-bold text-white ring-2 ring-white">
          {{ notifications.unread() }}
        </span>
      }
    </button>

    @if (bellOpen()) {
      <div class="absolute right-0 mt-2 w-80 overflow-hidden rounded-xl border border-gray-200 bg-white shadow-lg">
        <div class="border-b border-gray-200 px-4 py-2.5">
          <p class="text-sm font-semibold text-gray-900">Notifications</p>
        </div>
        <div class="max-h-80 overflow-y-auto">
          @for (n of notifications.items(); track n.id) {
            <button type="button" (click)="open(n.targetUrl)"
                    class="block w-full border-b border-gray-100 px-4 py-3 text-left hover:bg-gray-50">
              <p class="text-sm font-semibold text-gray-900">{{ n.title }}</p>
              <p class="mt-0.5 text-sm text-gray-600">{{ n.body }}</p>
              <p class="mt-1 text-xs text-gray-400">{{ when(n.createdAt) }}</p>
            </button>
          } @empty {
            <p class="px-4 py-8 text-center text-sm text-gray-500">Nothing yet</p>
          }
        </div>
      </div>
    }
  </div>

  <!-- account -->
  <div class="relative">
    <button type="button" (click)="toggleMenu()" aria-label="Account menu"
            class="grid h-9 w-9 place-items-center rounded-full bg-blue-50 text-xs font-semibold text-blue-800
                   hover:bg-blue-100">
      {{ auth.initials() }}
    </button>

    @if (menuOpen()) {
      <div class="absolute right-0 mt-2 w-56 overflow-hidden rounded-xl border border-gray-200 bg-white shadow-lg">
        <div class="border-b border-gray-200 px-4 py-3">
          <p class="truncate text-sm font-semibold text-gray-900">{{ auth.user()?.fullName }}</p>
          <p class="truncate text-xs text-gray-500">{{ auth.user()?.email }}</p>
        </div>
        <button type="button" (click)="open('/profile')"
                class="block w-full px-4 py-2.5 text-left text-sm text-gray-700 hover:bg-gray-50">
          My profile
        </button>
        <button type="button" (click)="logout()"
                class="block w-full border-t border-gray-200 px-4 py-2.5 text-left text-sm text-red-700 hover:bg-red-50">
          Sign out
        </button>
      </div>
    }
  </div>
</header>
