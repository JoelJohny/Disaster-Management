<div class="flex min-h-screen bg-gray-50">
  <!-- backdrop on mobile -->
  @if (isMobile() && sidebarOpen()) {
    <div class="fixed inset-0 z-30 bg-black/40 lg:hidden" (click)="toggleSidebar()"></div>
  }

  <app-sidebar
    [isVisible]="sidebarOpen()"
    [isMobile]="isMobile()"
    (toggle)="toggleSidebar()" />

  <div class="flex min-w-0 flex-1 flex-col">
    <app-header [isMobile]="isMobile()" (menuToggle)="toggleSidebar()" />

    <main class="flex-1">
      <div class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6">
        <router-outlet />
      </div>
    </main>

    <app-footer />
  </div>
</div>

<app-toasts />
